<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1>Office Management System</h1>
      <span class="subtitle">Staff Directory &amp; Status Portal</span>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Staff</span>
        <strong id="statTotal" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active in Office</span>
        <strong id="statActive" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Remote</span>
        <strong id="statRemote" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">On Leave</span>
        <strong id="statLeave" class="stat-value">0</strong>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">Add New Employee</h2>
      <form id="employeeForm" class="form-grid">
        <input type="hidden" id="employeeId" />

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Ananya Sen" required />
        </div>

        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" placeholder="e.g. ananya@company.com" required />
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option value="Engineering">Engineering</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Operations">Operations</option>
          </select>
        </div>

        <div class="form-group">
          <label for="roleTitle">Job Role</label>
          <input type="text" id="roleTitle" placeholder="e.g. Software Developer" required />
        </div>

        <div class="form-group">
          <label for="status">Work Status</label>
          <select id="status" required>
            <option value="Active">Active</option>
            <option value="Remote">Remote</option>
            <option value="On Leave">On Leave</option>
          </select>
        </div>

        <div class="form-group">
          <label for="salary">Monthly Salary</label>
          <input type="number" id="salary" min="0" step="0.01" placeholder="e.g. 55000" required />
        </div>

        <div class="form-group">
          <label for="joinedDate">Joined Date</label>
          <input type="date" id="joinedDate" required />
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Add Employee</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">Cancel</button>
        </div>
      </form>
      <p id="formMessage" class="message"></p>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Employee Directory</h2>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search by name, email, or role..." />
          <select id="filterDepartment">
            <option value="">All Departments</option>
            <option value="Engineering">Engineering</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Operations">Operations</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Role</th>
              <th>Status</th>
              <th>Salary</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <tr><td colspan="8" class="empty-row">Loading employees...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
